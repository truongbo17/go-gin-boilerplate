name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Format
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Source check
        run: bash scripts/check-source.sh
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
